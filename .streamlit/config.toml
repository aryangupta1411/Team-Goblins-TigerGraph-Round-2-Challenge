# HHGOA Fraud Investigator theme: a typology case study. The console reads like the
# typology reports published by FATF, the Egmont Group and FinCEN (the agent's own
# grounding corpus): an institutional petrol owns the shell, work surfaces stay
# white, and colour on the page means something. Red marks red flags, fraud and
# hard actions; ochre marks uncertain and anything waiting on a human; green marks
# legitimate and executed; the L1/L2 human gates take the shell's petrol. Public
# Sans and Roboto Mono are the US federal design system's faces (FinCEN is a
# Treasury bureau). Light and dark are both defined so judges get a working theme
# switcher (top-right menu -> Settings -> Choose app theme) regardless of their OS.
# The tokens ui/design.py injects for custom components mirror these values.

[theme]
font = "'Public Sans':https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap"
codeFont = "'Roboto Mono':https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap"
baseFontSize = 15
headingFontSizes = ["26px", "20px", "17px", "15px", "14px", "13px"]
headingFontWeights = [650, 600, 600, 600, 600, 600]
linkUnderline = false

baseRadius = "4px"
buttonRadius = "4px"
showWidgetBorder = true
showSidebarBorder = true

[theme.light]
primaryColor = "#0f3b57"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#eef3f6"
textColor = "#14212b"
linkColor = "#1f5a80"

borderColor = "#d5dee5"
codeTextColor = "#14212b"
codeBackgroundColor = "#f1f5f8"

# Semantic palette. The names are Streamlit's; the meanings are the console's:
# red = red flag / fraud / hard action, yellow = ochre (uncertain, awaiting a
# human), green = legitimate / executed, orange = a data or input warning,
# blue and violet = the petrol of the human gates, gray = neutral.
redColor = "#c8102e"
redBackgroundColor = "#fbe9ec"
redTextColor = "#9c0d24"

orangeColor = "#c2410c"
orangeBackgroundColor = "#fcede4"
orangeTextColor = "#9a340a"

yellowColor = "#b7791f"
yellowBackgroundColor = "#fbf1e0"
yellowTextColor = "#8a5a12"

greenColor = "#1d7a4e"
greenBackgroundColor = "#e6f3ec"
greenTextColor = "#16603d"

blueColor = "#1f5a80"
blueBackgroundColor = "#e3edf4"
blueTextColor = "#174a6a"

violetColor = "#1f5a80"
violetBackgroundColor = "#e3edf4"
violetTextColor = "#174a6a"

grayColor = "#55687a"
grayBackgroundColor = "#eef2f5"
grayTextColor = "#3d4f5e"

# the first series is the petrol: the main data element carries the one hue
chartCategoricalColors = ["#0f3b57", "#c8102e", "#b7791f", "#1d7a4e", "#5b7a90", "#9aaebd", "#2f6a8f"]

# no header band: the header row sits on the page ground, rules and alignment do the work
dataframeBorderColor = "#d5dee5"
dataframeHeaderBackgroundColor = "#ffffff"

[theme.light.sidebar]
backgroundColor = "#f4f7f9"
secondaryBackgroundColor = "#e9f0f4"
borderColor = "#d5dee5"
primaryColor = "#0f3b57"

[theme.dark]
# the primary carries white button text, so it stays dark enough for 4.5:1
primaryColor = "#2a7aa5"
backgroundColor = "#0c1a23"
secondaryBackgroundColor = "#142733"
textColor = "#e3eaef"
linkColor = "#8cc3e0"

borderColor = "#23394a"
codeTextColor = "#e3eaef"
codeBackgroundColor = "#132634"

redColor = "#f2606f"
redBackgroundColor = "#3a141b"
redTextColor = "#ffb3bb"

orangeColor = "#f0874a"
orangeBackgroundColor = "#3a1d0f"
orangeTextColor = "#ffc29e"

yellowColor = "#e2a94f"
yellowBackgroundColor = "#3a2a10"
yellowTextColor = "#f3cf8c"

greenColor = "#4fbf86"
greenBackgroundColor = "#0f2c1f"
greenTextColor = "#9be0bd"

blueColor = "#8cc3e0"
blueBackgroundColor = "#15324a"
blueTextColor = "#b9dcef"

violetColor = "#8cc3e0"
violetBackgroundColor = "#15324a"
violetTextColor = "#b9dcef"

grayColor = "#93a7b6"
grayBackgroundColor = "#1b2f3c"
grayTextColor = "#c9d6df"

chartCategoricalColors = ["#8cc3e0", "#f2606f", "#e2a94f", "#4fbf86", "#93a7b6", "#5b7a90", "#2a7aa5"]

dataframeBorderColor = "#23394a"
dataframeHeaderBackgroundColor = "#0c1a23"

[theme.dark.sidebar]
backgroundColor = "#0a161e"
secondaryBackgroundColor = "#112330"
borderColor = "#1d3142"
primaryColor = "#2a7aa5"

[client]
# "viewer" keeps developer clutter (deploy, rerun, clear cache) out of the
# menu/toolbar for the demo, while still showing the theme toggle judges
# need to switch light/dark ("minimal" hides the menu outright once no
# developer options are left in it, which took the theme toggle with it).
toolbarMode = "viewer"
