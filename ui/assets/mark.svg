<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 32" width="256" height="32" fill="none">
  <!-- drawn for the petrol shell band (the same in light and dark), so it carries no colour-scheme switch -->
  <style>
    text { fill: #ffffff; font: 650 16px "Public Sans", -apple-system, "Segoe UI", sans-serif; letter-spacing: -.1px; }
    .tile { fill: #ffffff; } .node { fill: #0f3b57; } .edge { stroke: #0f3b57; }
  </style>
  <rect class="tile" width="32" height="32" rx="4"/>
  <path class="edge" d="M9.5 21.5 16 10.5l6.5 11M9.5 21.5h13" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity=".55"/>
  <circle class="node" cx="9.5" cy="21.5" r="2.6"/>
  <circle class="node" cx="22.5" cy="21.5" r="2.6"/>
  <!-- the flagged vertex: the red flag of the typology reports -->
  <circle cx="16" cy="10.5" r="3" fill="#c8102e"/>
  <!-- this app's own name: TigerGraph is credited separately ("Built on TigerGraph Savanna"), never presented as our brand -->
